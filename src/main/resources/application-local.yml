spring:
  datasource:
    url: "jdbc:postgresql://localhost:5050/authdb-service-local"
    username: "${SPRING_DATASOURCE_LOCAL_USERNAME}"
    password: "${SPRING_DATASOURCE_LOCAL_PASSWORD}"

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "http://localhost:2310/auth-server/login/oauth2/code/google"

server:
  port: 2310

integration:
  toxicbet:
    users:
      base-url: "http://localhost:10000"

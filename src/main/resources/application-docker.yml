spring:
  datasource:
    url: "jdbc:postgresql://postgres-auth:5432/authdb"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "http://localhost:2300/auth-server/login/oauth2/code/google"

server:
  port: 2300
  forward-headers-strategy: framework

integration:
  toxicbet:
    users:
      base-url: "http://localhost:20000"

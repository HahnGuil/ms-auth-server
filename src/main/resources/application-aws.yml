spring:
  datasource:
    url: "jdbc:postgresql://postgres-auth:5432/authdb"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "https://auth.toxicbet.com.br/auth-server/login/oauth2/code/google"

server:
  port: 2300
  forward-headers-strategy: framework

integration:
  toxicbet:
    users:
      base-url: "https://api.toxicbet.com.br"

frontend:
  origin: "https://toxicbet.com.br"
  oauth-callback-path: "/oauth/callback"
